name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux Clang quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-22
      CXX: clang++-22

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install LLVM 22 quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates cmake curl gnupg ninja-build \
            libfontconfig1-dev libva-dev python3-dev
          llvm_key=$(mktemp)
          trap 'rm -f "$llvm_key"' EXIT
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$llvm_key"
          primary_fingerprint=$(gpg --show-keys --with-colons "$llvm_key" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$primary_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < "$llvm_key" | \
            sudo tee /usr/share/keyrings/llvm-snapshot.gpg >/dev/null
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-22 clang-format-22 clang-tidy-22

      # The key suffix is sha256(sorted "<component> <archiveSha256>\n" lines for every
      # dependencies.lock.json component that has its own downloaded archive), so it changes
      # deterministically whenever the locked archive set changes (a component added/removed/
      # re-versioned) and is unaffected by lock member reordering. openjph is a lock component but
      # is vendored inside the OpenEXR archive (see dependencies/licenses/openjph/provenance.md)
      # rather than separately downloaded, so it contributes no line of its own; its bytes are
      # already covered by the openexr line. The key started as the yyjson archive digest alone
      # (the first locked component); imath, libdeflate, and openexr's intake extended it to six;
      # opencolorio's intake (and its expat/yaml-cpp/pystring/minizip-ng transitives), plus the
      # OpenH264 source archive, extends it to the current fourteen-line component set per this
      # convention rather than embedding every raw digest in the key.
      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bloom-dependency-downloads
          key: bloom-dependency-archives-82571923722fa396b5d40449e487c86b8ab421e66581f34a0de828b9e13eb9e8

      - name: Build dependency superbuild prefix
        run: |
          cmake -S dependencies/superbuild -B "${{ runner.temp }}/bloom-superbuild" -G Ninja \
            -DBLOOM_DEPENDENCY_DOWNLOAD_DIR="${{ runner.temp }}/bloom-dependency-downloads" \
            -DBLOOM_DEPENDENCY_PREFIX="$GITHUB_WORKSPACE/build/dependency-prefix" \
            -DBLOOM_FFMPEG_ENABLE_VAAPI=ON
          cmake --build "${{ runner.temp }}/bloom-superbuild"

      - name: Configure Clang and clang-tidy
        run: cmake --preset ci-linux-native -DBLOOM_BUILD_PYTHON=ON

      - name: Check repository quality
        run: cmake --build --preset ci-linux-native --target bloom-quality-check --parallel

      - name: Build with clang-tidy
        run: cmake --build --preset ci-linux-native --parallel

      - name: Test Clang build
        run: ctest --preset ci-linux-native --output-on-failure

      - name: Consume prefix in qualified mode
        run: |
          cmake -S tests/dependency-consumption -B "${{ runner.temp }}/bloom-consume" -G Ninja \
            -DBLOOM_DEPENDENCY_MODE=qualified \
            -DBLOOM_DEPENDENCY_PREFIX="$GITHUB_WORKSPACE/build/dependency-prefix" \
            -DBLOOM_MEDIA_WORKER_RUNTIME="$GITHUB_WORKSPACE/build/ci-linux-native/apps/bloom-media-worker/lib"
          cmake --build "${{ runner.temp }}/bloom-consume"
          "${{ runner.temp }}/bloom-consume/bloom_consume_smoke"

  linux-desktop:
    name: Linux Qt desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang-22
      CXX: clang++-22
      # Widgets tests run without a display server; the offscreen platform keeps them headless.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install LLVM 22 quality tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates cmake curl gnupg ninja-build \
            libgl-dev libegl-dev libfontconfig1-dev libxkbcommon-dev libva-dev python3-dev
          llvm_key=$(mktemp)
          trap 'rm -f "$llvm_key"' EXIT
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$llvm_key"
          primary_fingerprint=$(gpg --show-keys --with-colons "$llvm_key" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$primary_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < "$llvm_key" | \
            sudo tee /usr/share/keyrings/llvm-snapshot.gpg >/dev/null
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-22 clang-format-22 clang-tidy-22

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/qt
          key: bloom-qt-6.8.3-linux-gcc-64

      - name: Install Qt 6.8
        if: steps.cache-qt.outputs.cache-hit != 'true'
        # Runs from the runner temp directory: aqt writes aqtinstall.log into its working
        # directory, and a stray log in the workspace fails the repository hygiene check.
        working-directory: ${{ runner.temp }}
        run: |
          python3 -m pip install --user aqtinstall==3.2.1
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            --outputdir "${{ runner.temp }}/qt"

      # The key suffix is sha256(sorted "<component> <archiveSha256>\n" lines for every
      # dependencies.lock.json component that has its own downloaded archive), so it changes
      # deterministically whenever the locked archive set changes (a component added/removed/
      # re-versioned) and is unaffected by lock member reordering. openjph is a lock component but
      # is vendored inside the OpenEXR archive (see dependencies/licenses/openjph/provenance.md)
      # rather than separately downloaded, so it contributes no line of its own; its bytes are
      # already covered by the openexr line. The key started as the yyjson archive digest alone
      # (the first locked component); imath, libdeflate, and openexr's intake extended it to six;
      # opencolorio's intake (and its expat/yaml-cpp/pystring/minizip-ng transitives), plus the
      # OpenH264 source archive, extends it to the current fourteen-line component set per this
      # convention rather than embedding every raw digest in the key.
      - name: Cache dependency archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/bloom-dependency-downloads
          key: bloom-dependency-archives-82571923722fa396b5d40449e487c86b8ab421e66581f34a0de828b9e13eb9e8

      - name: Build dependency superbuild prefix
        run: |
          cmake -S dependencies/superbuild -B "${{ runner.temp }}/bloom-superbuild" -G Ninja \
            -DBLOOM_DEPENDENCY_DOWNLOAD_DIR="${{ runner.temp }}/bloom-dependency-downloads" \
            -DBLOOM_DEPENDENCY_PREFIX="$GITHUB_WORKSPACE/build/dependency-prefix" \
            -DBLOOM_FFMPEG_ENABLE_VAAPI=ON
          cmake --build "${{ runner.temp }}/bloom-superbuild"

      - name: Configure desktop build
        run: |
          cmake --preset ci-linux-desktop -DBLOOM_BUILD_PYTHON=ON \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/qt/6.8.3/gcc_64"

      - name: Build desktop with clang-tidy
        run: cmake --build --preset ci-linux-desktop --parallel

      - name: Test desktop build
        run: ctest --preset ci-linux-desktop --output-on-failure

      - name: Upload golden captures on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-captures-${{ github.run_id }}
          path: build/*.png
          if-no-files-found: ignore
          retention-days: 7
