name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux Clang quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install --yes clang clang-format clang-tidy ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Configure Clang and clang-tidy
        run: cmake --preset dev -DBLOOM_ENABLE_CLANG_TIDY=ON

      - name: Check repository quality
        run: cmake --build --preset dev --target bloom-quality-check --parallel

      - name: Build with clang-tidy
        run: cmake --build --preset dev --parallel

      - name: Test repository checkers
        run: >-
          ctest --preset dev
          -R '^bloom\.quality\..*_self_tests$'
          --output-on-failure

      - name: Test Clang build
        run: ctest --preset dev --output-on-failure
