name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux Clang quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install --yes clang clang-format clang-tidy cmake ninja-build

      - name: Configure Clang and clang-tidy
        run: cmake --preset ci-linux-native

      - name: Check repository quality
        run: cmake --build --preset ci-linux-native --target bloom-quality-check --parallel

      - name: Build with clang-tidy
        run: cmake --build --preset ci-linux-native --parallel

      - name: Test Clang build
        run: ctest --preset ci-linux-native --output-on-failure
