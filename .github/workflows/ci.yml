name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install --yes clang clang-format clang-tidy ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Configure Clang and clang-tidy
        run: cmake --preset dev -DBLOOM_ENABLE_CLANG_TIDY=ON

      - name: Check repository quality
        run: cmake --build --preset dev --target bloom-quality-check --parallel

      - name: Build with clang-tidy
        run: cmake --build --preset dev --parallel

      - name: Test repository checkers
        run: ctest --preset dev -R '^bloom\.quality\.checker_self_tests$'

      - name: Test Clang build
        run: ctest --preset dev -LE quality

  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev -LE quality
